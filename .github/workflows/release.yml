name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest

    # PyPI authenticates this workflow over OIDC, so no token is stored
    # anywhere. Requiring a reviewer on this environment is the way to gate a
    # release, since an upload cannot be taken back.
    environment: pypi

    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - name: Check the tag matches the declared version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          if [ "$tag" != "$version" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match the declared version ${version}" >&2
            exit 1
          fi
          echo "releasing ${version}"

      - name: Install the project
        run: uv sync

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Test
        run: uv run pytest -q

      - name: Build
        run: uv build

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always
