site_name: sqlmodel-async-factory
site_description: sqlmodel-async-factory, factory_boy factories that build and persist SQLModel objects through an async session.
site_url: https://sqlmodel-async-factory.businessagile.eu/
theme:
  variant: classic
  name: material
  custom_dir: overrides
  font: false
  palette:
  - media: "(prefers-color-scheme)"
    toggle:
      icon: material/lightbulb-auto
      name: Switch to light mode
  - media: '(prefers-color-scheme: light)'
    scheme: default
    primary: deep purple
    accent: amber
    toggle:
      icon: material/lightbulb
      name: Switch to dark mode
  - media: '(prefers-color-scheme: dark)'
    scheme: slate
    primary: deep purple
    accent: amber
    toggle:
      icon: material/lightbulb-outline
      name: Switch to system preference
  features:
  - content.code.annotate
  - content.code.copy
  - navigation.footer
  - navigation.indexes
  - navigation.instant
  - navigation.tabs
  - navigation.top
  - navigation.tracking
  - search.highlight
  - search.suggest
  - toc.follow
  icon:
    repo: simple/github
  logo: img/icon-white.svg
  favicon: img/favicon.svg
  language: en
repo_name: BiBzz/sqlmodel-async-factory
repo_url: https://github.com/BiBzz/sqlmodel-async-factory
edit_uri: ""
copyright: >-
  <span class="ba-author">Created by <a href="https://businessagile.eu/en/about" target="_blank" rel="noopener">Alexandre BERREBI</a></span>
  <span class="ba-credit">Made by <span class="ba-logo"><a href="https://businessagile.eu" target="_blank" rel="noopener"><img src="/img/business-agile-logo.png" alt="Business Agile" height="40"></a>,</span> European custom development studio</span>
  <span class="ba-legal"><a href="/about/legal-notice/">Legal notice</a> · <a href="/about/privacy/">Privacy and cookies</a></span>

extra:
  generator: false

nav:
  - sqlmodel-async-factory: index.md
  - features.md
  - design.md
  - reference.md
  - About:
    - about/legal-notice.md
    - about/privacy.md

markdown_extensions:
  abbr: null
  attr_list: null
  md_in_html: null
  tables: null
  toc:
    permalink: true
  admonition: null
  pymdownx.details: null
  pymdownx.superfences: null
  pymdownx.highlight:
    line_spans: __span
  pymdownx.inlinehilite: null
  pymdownx.snippets:
    base_path: [docs_src]
    check_paths: true
  pymdownx.emoji:
    emoji_index: !!python/name:material.extensions.emoji.twemoji
    emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - css/custom.css
