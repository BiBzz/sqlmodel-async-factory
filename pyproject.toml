[project]
name = "sqlmodel-async-factory"
version = "0.1.0"
description = "factory_boy factories that build and persist SQLModel objects through an async session"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Alexandre BERREBI", email = "alexandre.berrebi@businessagile.eu" },
]
requires-python = ">=3.10"
keywords = ["factory-boy", "sqlmodel", "sqlalchemy", "asyncio", "testing", "fixtures"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "factory-boy>=3",
    # the asyncio extra pulls greenlet, without which AsyncSession cannot run
    "sqlalchemy[asyncio]>=2",
    "sqlmodel>=0.0.25",
]

[project.urls]
Homepage = "https://github.com/BiBzz/sqlmodel-async-factory"
Repository = "https://github.com/BiBzz/sqlmodel-async-factory"
Issues = "https://github.com/BiBzz/sqlmodel-async-factory/issues"

[dependency-groups]
dev = [
    "aiosqlite>=0.20",
    "mypy>=1.11",
    "pytest>=8.4.2",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.mypy]
python_version = "3.10"
files = ["src", "tests"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true

[build-system]
requires = ["uv_build>=0.8.7,<0.9.0"]
build-backend = "uv_build"
